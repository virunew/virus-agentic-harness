[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskclerk"
version = "0.1.0"
description = "Accept a ticket file and show which lines still need a person."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
